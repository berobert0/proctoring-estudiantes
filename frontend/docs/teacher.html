<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel Docente</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .teacher-shell{max-width:1180px;margin:28px auto;padding:0 18px}.teacher-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .teacher-panel{background:#fff;border:1px solid #e3e8ef;border-radius:15px;padding:20px;box-shadow:0 7px 22px rgba(16,24,40,.06)}
    .teacher-panel h2{margin-top:0}.teacher-list{display:grid;gap:9px}.teacher-item{padding:12px;border:1px solid #e3e8ef;border-radius:10px}
    .teacher-item small{color:#667085}.teacher-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    @media(max-width:800px){.teacher-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo">D</div><div><h1>Panel del profesor</h1><p>Gestión académica y supervisión</p></div></div>
  </header>
  <main class="teacher-shell">
    <div class="teacher-actions">
      <strong id="teacherName"></strong>
      <button id="logoutBtn" class="btn secondary">Cerrar sesión</button>
    </div>
    <div class="teacher-grid">
      <section class="teacher-panel">
        <h2>Mis cursos</h2>
        <div id="courseList" class="teacher-list"></div>
      </section>
      <section class="teacher-panel">
        <h2>Evaluaciones</h2>
        <div id="examList" class="teacher-list"><p>Selecciona un curso.</p></div>
      </section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
